<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Perfil - Demostración HTML/CSS</title>
    <style>
        /* Estilos CSS incluidos */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 350px;
            text-align: center;
        }
        .card h2 {
            color: #333;
            margin-bottom: 5px;
        }
        .card p {
            color: #666;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Estructura HTML -->
    <div class="card">
        <h2>Maria Gonzalez</h2>
        <p>Estudiante de Informática & Desarrolladora Software Trainee</p>
        <span class="badge">JavaScript / Python / C++</span>
    </div>

</body>
</html>
